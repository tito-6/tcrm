# TCRM production reverse proxy specification
# Upstream Next.js Public Site: 127.0.0.1:3002
# Upstream Odoo/TCRM Backend: 127.0.0.1:8069

upstream tcrm_odoo {
    server 127.0.0.1:8069;
    keepalive 32;
}

upstream tcrm_public {
    server 127.0.0.1:3002;
    keepalive 32;
}

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name tcrm.online www.tcrm.online *.tcrm.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Tenant Subdomains (*.tcrm.online) -> 100% Odoo Backend Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^(?<subdomain>.+)\.tcrm\.online$;

    ssl_certificate     /etc/letsencrypt/live/tcrm.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tcrm.online/privkey.pem;

    client_max_body_size 64M;

    location /websocket {
        proxy_pass http://tcrm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /longpolling {
        proxy_pass http://tcrm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location / {
        proxy_pass http://tcrm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

# Apex & www (tcrm.online, www.tcrm.online) -> High-Priority Backend Routes & Public Next.js Website
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tcrm.online www.tcrm.online;

    ssl_certificate     /etc/letsencrypt/live/tcrm.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tcrm.online/privkey.pem;

    client_max_body_size 64M;

    # 1. High-Priority Webhook Callbacks
    location /webhook/ {
        proxy_pass http://tcrm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /whatsapp/ {
        proxy_pass http://tcrm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 2. General TCRM Controllers & Twilio Voice Callbacks (/tcrm/*)
    location /tcrm/ {
        proxy_pass http://tcrm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 3. High-Priority Backend Web Client & Master Routes
    location /web/ {
        proxy_pass http://tcrm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /tcrm_master/ {
        proxy_pass http://tcrm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /websocket {
        proxy_pass http://tcrm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /longpolling/ {
        proxy_pass http://tcrm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /report/ {
        proxy_pass http://tcrm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /payment/ {
        proxy_pass http://tcrm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /auth_oauth/ {
        proxy_pass http://tcrm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 4. Allowed Public Next.js API Routes (Explicit POST Allowed)
    location ~ ^/api/(lead|contact|documentation-feedback|documentation-search)$ {
        proxy_pass http://tcrm_public;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 5. Public Next.js Website & Documentation (GET/HEAD Only, Block Unknown POST)
    location / {
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://tcrm_public;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
