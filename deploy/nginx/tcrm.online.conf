# TCRM production reverse proxy
# Domains: tcrm.online, www.tcrm.online, *.tcrm.online
# Upstream: local Odoo/TCRM on 127.0.0.1:8069

upstream tcrm_odoo {
    server 127.0.0.1:8069;
    keepalive 32;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tcrm.online www.tcrm.online *.tcrm.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tcrm.online www.tcrm.online *.tcrm.online;

    ssl_certificate     /etc/letsencrypt/live/tcrm.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tcrm.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64M;

    # Preserve original host/scheme for Odoo proxy_mode + Twilio signature URLs
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  443;

    # Do not accept client-supplied X-Forwarded-* from arbitrary clients as source of truth
    # (nginx overwrites them above from the real connection).

    location /websocket {
        proxy_pass http://tcrm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }

    location /longpolling {
        proxy_pass http://tcrm_odoo;
        proxy_read_timeout 7200s;
    }

    location / {
        proxy_pass http://tcrm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 7200s;
        proxy_redirect off;
    }
}
