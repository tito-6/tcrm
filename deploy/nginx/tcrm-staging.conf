# TCRM Staging Reverse Proxy (public-staging.tcrm.online)
# Upstream Next.js Staging App: 127.0.0.1:3002
# Upstream Odoo/TCRM Staging Backend: 127.0.0.1:8069

upstream tcrm_odoo_staging {
    server 127.0.0.1:8069;
    keepalive 16;
}

upstream tcrm_public_staging {
    server 127.0.0.1:3002;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name public-staging.tcrm.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name public-staging.tcrm.online;

    ssl_certificate     /etc/letsencrypt/live/tcrm.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tcrm.online/privkey.pem;

    client_max_body_size 64M;

    # Staging High-Priority Backend Routes
    location /web/ {
        proxy_pass http://tcrm_odoo_staging;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /webhook/ {
        proxy_pass http://tcrm_odoo_staging;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Staging Next.js Public Website & Documentation
    location / {
        proxy_pass http://tcrm_public_staging;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
