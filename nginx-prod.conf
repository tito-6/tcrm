# TCRM production reverse proxy

limit_req_zone $binary_remote_addr zone=tcrm_public_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=tcrm_api_limit:10m rate=5r/s;

upstream tcrm_odoo {
    server 127.0.0.1:8069;
    keepalive 32;
}



upstream akod_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name tcrm.online www.tcrm.online *.tcrm.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Tenant subdomains (Odoo)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.tcrm.online;

    ssl_certificate     /etc/letsencrypt/live/tcrm.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tcrm.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64M;

    location /websocket {
        proxy_pass http://tcrm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }

    location /longpolling {
        proxy_pass http://tcrm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_read_timeout 7200s;
    }

    location / {
        proxy_pass http://tcrm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header Connection "";
        proxy_read_timeout 7200s;
        proxy_redirect off;
    }
}

# Public Apex and WWW
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tcrm.online www.tcrm.online;

    ssl_certificate     /etc/letsencrypt/live/tcrm.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tcrm.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64M;

    # Odoo specific routes
    location ~ ^/(web|tcrm|webhook|websocket|longpolling|report|payment|auth_oauth)(/.*)?$ {
        proxy_pass http://tcrm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 7200s;
    }



    # All other /api routes to AKOD API
    location /api/ {
        limit_req zone=tcrm_api_limit burst=10 nodelay;
        proxy_pass http://akod_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }



    # Default route -> Tenant UI (Odoo)
    location / {
        limit_req zone=tcrm_public_limit burst=50 nodelay;
        
        proxy_pass http://tcrm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
    }
}
